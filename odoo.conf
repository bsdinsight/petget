[options]
; Master password — protects the database manager (create / drop / backup).
; CHANGE THIS before you let anything other than your own machine reach Odoo.
admin_passwd = petnaly-change-this-master-password

; Petnaly modules live in this repository, mounted at /mnt/extra-addons.
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

data_dir = /var/lib/odoo

db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; Threaded mode — simplest for a single-machine install.
workers = 0
